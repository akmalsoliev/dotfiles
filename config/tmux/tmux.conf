# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'frizadiga/tmux-float-term'
set -g @plugin 'TechnicalDC/tmux-ayu-theme'

# Rename window text
set -g automatic-rename on

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Status bar is always hidden
set -g status off
# toggle status bar
bind-key b set-option status

# Enable mouse mode
set -g mouse on

# Enter copy mode with <prefix> and [
setw -g mode-keys vi
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
set-option -s set-clipboard on

# Split panes faster
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Clear tmux scrollback history
bind -n C-s send-keys C-l \; clear-history

# panes: open in current path
bind c new-window -c "#{pane_current_path}"
bind h split-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# reload config file (change file location to your the tmux.conf you want to use)
unbind r
bind r source-file ${XDG_CONFIG_HOME}/tmux/tmux.conf

# Easier search
bind S copy-mode \; send-keys /

# Continually renumber
set-option -g renumber-windows on

#+--- Bars ---+
set-option -g status-position bottom

# Remap for uninstall
set -g @tpm-clean 'u'

# Neovim
set-option -g focus-events on
set escape-time 0

# Initialize TPM plugin manager
run '${XDG_CONFIG_HOME}/tmux/plugins/tpm/tpm'

# Override status-right: put the date + time in the green pill instead of the hostname
set -g status-right "#[fg=#BAE67E,bg=#607080,nobold,nounderscore,noitalics]#[fg=#101521,bg=#BAE67E,bold] %d.%m.%Y | %H:%M "
